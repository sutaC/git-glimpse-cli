[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-glimpse-cli"
authors = [
  { name="sutaC", email="contact@sutac.pl" },
]
version = "0.1.0"
description = "CLI tool to manage and update shared GitHub repos with GitGlimpse."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.2"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/sutaC/git-glimpse-cli"

[project.scripts]
glimpse = "glimpsecli.main:cli"